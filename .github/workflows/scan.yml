name: Ticket quality scan

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scanner
        run: |
          curl -fsS -X POST "https://ticket-quality-webhook.vercel.app/api/scan-tickets" \
            -H "x-webhook-secret: ${{ secrets.WEBHOOK_SECRET }}"
